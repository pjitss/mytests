---
- name: Set current block details
  set_fact:
    current_block_name: "{{ exec_block }}"
    current_block_type: "{{ block_types[exec_block] }}"

- name: Extract current block text using awk
  shell: |
    awk '
      $0 == "[{{ exec_block }}]" {flag=1; next}
      $0 == "[/{{ exec_block }}]" {flag=0; exit}
      flag
    ' "{{ prog_file }}"
  args:
    executable: /bin/bash
  register: block_extract
  changed_when: false

- name: Set current block text
  set_fact:
    current_block_text: "{{ block_extract.stdout }}"

- name: Fail if block body is empty
  fail:
    msg: "Block {{ current_block_name }} was found but its body could not be extracted."
  when: current_block_text | trim == ""

- name: Show current block
  debug:
    msg:
      block_name: "{{ current_block_name }}"
      block_type: "{{ current_block_type }}"
      block_text: "{{ current_block_text.splitlines() }}"

- name: Execute COPY block
  include_tasks: run_copy_block.yml
  when: current_block_type == 'copy'

- name: Execute SQL block
  include_tasks: run_sql_block.yml
  when: current_block_type == 'sql'

- name: Skip FNDLOAD block for now
  debug:
    msg: "FNDLOAD execution not added yet for block {{ current_block_name }}"
  when: current_block_type == 'fndload'