---
- name: Extract SQL lines
  ansible.builtin.set_fact:
    sql_lines: >-
      {{
        current_block_text.splitlines()
        | map('trim')
        | reject('equalto', '')
        | reject('match', '^#')
        | list
      }}

- name: Convert SQL entries to filenames
  ansible.builtin.set_fact:
    sql_filenames: "{{ sql_lines | map('basename') | list }}"

- name: Fail if SQL block is empty
  ansible.builtin.fail:
    msg: "Block {{ current_block_name }} is present but has no SQL files listed."
  when: sql_filenames | length == 0

- name: Find each SQL file under deploy_root
  ansible.builtin.find:
    paths: "{{ deploy_root }}"
    patterns: "{{ file_item }}"
    recurse: true
    file_type: file
  loop: "{{ sql_filenames }}"
  loop_control:
    loop_var: file_item
    label: "{{ file_item }}"
  register: sql_find_results

- name: Fail if SQL file is missing
  ansible.builtin.fail:
    msg: >-
      In block {{ current_block_name }}, file '{{ res.item }}' not found under {{ deploy_root }}
  loop: "{{ sql_find_results.results }}"
  loop_control:
    loop_var: res
    label: "{{ res.item }}"
  when: res.matched | int == 0

- name: Fail if SQL file is duplicated
  ansible.builtin.fail:
    msg: >-
      In block {{ current_block_name }}, file '{{ res.item }}' found {{ res.matched }} times.
      Paths: {{ res.files | map(attribute='path') | list }}
  loop: "{{ sql_find_results.results }}"
  loop_control:
    loop_var: res
    label: "{{ res.item }}"
  when: res.matched | int > 1

- name: Build resolved SQL file paths
  ansible.builtin.set_fact:
    resolved_sql_paths: >-
      {{
        sql_find_results.results
        | map(attribute='files')
        | map('first')
        | map(attribute='path')
        | list
      }}

- name: Show SQL execution plan
  ansible.builtin.debug:
    msg:
      block: "{{ current_block_name }}"
      sql_files: "{{ resolved_sql_paths }}"

- name: Run SQL files in block order
  ansible.builtin.shell: |
    WRAP="/tmp/sqlwrap_{{ current_block_name }}_{{ (sql_file | basename) | regex_replace('[^A-Za-z0-9_.-]', '_') }}_$$.sql"

    cat > "$WRAP" <<EOF
    whenever sqlerror exit failure rollback;
    whenever oserror exit failure;
    @{{ sql_file }}
    exit;
    EOF

    {{ ebs_env_cmd }}
    sqlplus -s "{{ db_usrnm }}" @"$WRAP"
    rc=$?

    rm -f "$WRAP"
    exit $rc
  args:
    executable: /bin/bash
  loop: "{{ resolved_sql_paths }}"
  loop_control:
    loop_var: sql_file
    label: "{{ current_block_name }} -> {{ sql_file | basename }}"
  register: sql_run_result
  changed_when: true

- name: Show SQL output
  ansible.builtin.debug:
    var: sql_run_result.results