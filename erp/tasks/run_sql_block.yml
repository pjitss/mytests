---
- name: initialize sql_lines
  set_fact:
    sql_lines: []

- name: extract sql lines
  set_fact:
    sql_lines: "{{ sql_lines + [ line ] }}"
  vars:
    line: "{{ item | trim }}"
  loop: "{{ current_block_text.splitlines() }}"
  when:
    - line != ''
    - not line.startswith('#')

- name: convert sql entries to filenames
  set_fact:
    sql_filenames: "{{ sql_lines | map('basename') | list }}"

- name: fail if sql block is empty
  fail:
    msg: "block {{ current_block_name }} is present but no sql file listed"
  when: sql_filenames | length == 0

- name: find each sql file under deploy_root
  find:
    paths: "{{ deploy_root }}"
    patterns: "{{ file_item }}"
    recurse: true
    file_type: file
  loop: "{{ sql_filenames }}"
  loop_control:
    loop_var: file_item
    label: "{{ file_item }}"
  register: sql_find_results

- name: fail if sql file is missing
  fail:
    msg: "In block {{ current_block_name }}, file {{ res.item }} not found under {{ deploy_root }}"
  loop: "{{ sql_find_results.results }}"
  loop_control:
    loop_var: res
    label: "{{ res.item }}"
  when: res.matched | int == 0

- name: fail if sql file is duplicated
  fail:
    msg: "In block {{ current_block_name }}, file {{ res.item }} found {{ res.matched }} times. Paths: {{ res.files | map(attribute='path') | list }}"
  loop: "{{ sql_find_results.results }}"
  loop_control:
    loop_var: res
    label: "{{ res.item }}"
  when: res.matched | int > 1

- name: build resolved sql file paths
  set_fact:
    resolved_sql_paths: "{{ sql_find_results.results | map(attribute='files') | map('first') | map(attribute='path') | list }}"

- name: show sql execution plan
  debug:
    msg:
      block: "{{ current_block_name }}"
      sql_files: "{{ resolved_sql_paths }}"

- name: run sql files in block order
  shell: |
    WRAP="/tmp/sqlwrap_{{ current_block_name }}_{{ sql_file | basename }}_$$.sql"

    cat > "$WRAP" <<EOF
    whenever sqlerror exit failure rollback;
    whenever oserror exit failure;
    @{{ sql_file }}
    exit;
    EOF

    {{ ebs_env_cmd }}
    sqlplus -s "{{ db_usrnm }}" @"$WRAP"
    rc=$?

    rm -f "$WRAP"
    exit $rc
  args:
    executable: /bin/bash
  loop: "{{ resolved_sql_paths }}"
  loop_control:
    loop_var: sql_file
    label: "{{ current_block_name }} -> {{ sql_file | basename }}"
  register: sql_run_result
  changed_when: true

- name: show sql output
  debug:
    var: sql_run_result.results