# ================================
# Ansible Playbook: package-manage.yml
# ================================

- hosts: "{{ COMP }}"
  gather_facts: true
  vars:
    file_names: "{{ files_input.split(',') }}"
  vars_files:
    - "../vars/myvars"

  tasks:
    - name: Check Connectivity
      win_ping:
      register: ping_status
      when: OS == "winrm"

    - name: Check Connectivity
      ping:
      register: ping_status
      when: OS == "ssh"

    - name: Print ping status (Linux)
      debug:
        msg: "{{ ping_status.ping }}"
      when: OS == "ssh"

    - name: Print ping status (Windows)
      debug:
        msg: "{{ ping_status }}"
      when: OS == "winrm"

    - name: Print variable values
      debug:
        msg:
          - "server dest path is: {{ server_download_path }}"
          - "repo dir is: {{ repo_dir }}"
          - "source path is: {{ upload_source_path }}"
          - "linux upload path is: {{ upload_source_path_lin }}"
          - "nexus_pr path is: {{ nexus_repo_pr }}"

    - name: Verify if file extension is zip
      fail:
        msg: "Package file '{{ item }}' not having .zip extension, failing the pipeline"
      when: item is not regex(".*\\.zip$")
      loop: "{{ file_names }}"

    - name: Upload file from Windows source to Nexus
      win_shell: >
        curl.exe -v -k -u {{ nexus_username }}:{{ nexus_password }} --upload-file {{ upload_source_path }}\\{{ file_names }} {{ nexus_pr_path }}
      register: upload_status
      when:
        - task == "upload"
        - OS == "winrm"
        - ENVNAME == "UAT"

    - name: Upload files from Linux source to Nexus UAT
      shell: >
        curl -v -k -u {{ nexus_username }}:{{ nexus_password }} --upload-file {{ upload_source_path_lin }}/{{ item }} {{ nexus_uat_path }}/{{ item }}
      register: upload_status
      when:
        - task == "upload"
        - OS == "ssh"
        - ENVNAME == "UAT"
      loop: "{{ file_names }}"

    - name: Print upload status
      debug:
        var: upload_status
      when: 
        - task == "upload"
        - ENVNAME == "UAT"


    - name: Generate SHA1 checksum
      shell: sha1sum {{ upload_source_path_lin }}/{{ file_names }} | awk '{print $1}'
      register: file_checksum
      when:
        - task == "upload"
        - OS == "ssh"
        - ENVNAME != "UAT"

    - name: Output SHA1 checksum
      debug:
        msg: "SHA1 for {{ file_names }} is {{ file_checksum.stdout }}"
      when: 
      - task == "upload"
      - ENVNAME != "UAT"

    - name: Create checksum file
      copy:
        dest: "{{ upload_source_path_lin }}/{{ file_names }}.sha1"
        content: "{{ file_checksum.stdout }}"
      when: 
       - task == "upload"
       - ENVNAME != "UAT"

    - name: Upload file from Linux source to Nexus PROD
      shell: >
        curl -v -k -u {{ nexus_username }}:{{ nexus_password }}
        --upload-file {{ upload_source_path_lin }}/{{ file_names }}
        {{ nexus_pr_path }}/{{ file_names }}
      register: upload_status
      when:
        - task == "upload"
        - OS == "ssh"
        - ENVNAME != "UAT"

    - name: Print upload status
      debug:
        var: upload_status
      when: 
        - task == "upload"
        - ENVNAME != "UAT"

    - name: Upload checksum file to Nexus PROD
      shell: >
        curl -v -k -u {{ nexus_username }}:{{ nexus_password }}
        --upload-file {{ upload_source_path_lin }}/{{ file_names }}.sha1
        {{ nexus_pr_path }}/{{ file_names }}.sha1
      register: upload_checksum_status
      when:
        - task == "upload"
        - OS == "ssh"
        - ENVNAME != "UAT"


###Download Task####

    - name: Ensure destination directory exists on Windows dest server
      win_file:
        path: "{{ server_download_path }}"
        state: directory
      when:
        - task == "download"
        - OS == "winrm"

    - name: Ensure destination directory exists on Linux dest server
      file:
        path: "{{ server_download_path_lin }}"
        state: directory
      when:
        - task == "download"
        - OS == "ssh"

    - name: Check if file already exists on Windows dest server
      win_stat:
        path: "{{ server_download_path }}\\{{ file_names }}"
      register: file_result
      when:
        - task == "download"
        - OS == "winrm"

    - name: Download package to Windows dest server
      win_get_url:
        url: "{{ nexus_pr_path }}/{{ file_names }}"
        dest: "{{ server_download_path }}\\{{ file_names }}"
        validate_certs: false
        url_username: "{{ nexus_username }}"
        url_password: "{{ nexus_password }}"
        checksum: "sha1:{{ checksum_val }}"
        follow_redirects: all
        timeout: 300
      when:
        - task == "download"
        - OS == "winrm"
        - not file_result.stat.exists

    - name: Check if file already exists on Linux dest server
      stat:
        path: "{{ server_download_path_lin }}/{{ file_names }}"
      register: file_result
      when:
        - task == "download"
        - OS == "ssh"

    - name: Download package to Linux dest server
      get_url:
        url: "{{ nexus_pr_path }}"
        dest: "{{ server_download_path_lin }}"
        validate_certs: false
        url_username: "{{ nexus_username }}"
        url_password: "{{ nexus_password }}"
        checksum: "sha1:{{ checksum_val }}"
      when:
        - task == "download"
        - OS == "ssh"
        - not file_result.stat.exists
