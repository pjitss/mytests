- hosts: upload
  gather_facts: true
  #become: yes
  become_method: runas
  vars_files:
    - ../vars/epm.vars
  tasks:

    - name: Verify if file extension is zip
      fail:
        msg: "Package file '{{ package_name }}' not having .zip extension, failing the pipeline"
      when: package_name is not regex(".*\\.zip$")

    - name: Create timestamp
      set_fact:
        date_time: "{{ lookup('pipe', 'date +%b%d_%Y_%H-%M-%S') }}"

    - name: Ensure package exists in upload directory
      win_stat:
        path: "{{ upload_source_path }}\\{{ package_name }}"
      register: pkg_stat

    - name: Fail if package not found
      fail:
        msg: "Package not found at {{ upload_source_path }}\\{{ package_name }}"
      when: 
        - not pkg_stat.stat.exists

    - name: Build full source file path
      set_fact:
        source_file: "{{ upload_source_path }}\\{{ package_name }}"
        artifact_name: "TestPackage_{{ date_time }}.zip"

    - name: Upload the Package to Nexus {{ENVNAME}} dir from a Win source server
      win_shell: >
        curl.exe -v -s -k -w "%{http_code}" -u {{ nexus_username }}:{{ nexus_password }}
        --upload-file "{{ source_file }}"
        "{{ nexus_np_path }}{{ ENVNAME }}/{{ artifact_name }}"
      register: upload_rslt
      
    - name: Print Nexus upload HTTP status
      debug:
        msg: "Nexus upload HTTP status code: {{ upload_rslt.stdout }}"
    
    - name: Confirm Nexus upload success
      fail:
        msg: "Nexus upload failed for {{ artifact_name }}. HTTP code: {{ upload_result.stdout }}"
      when:
        - TASK == "upload"
        - upload_rslt.stdout not in ["200", "201", "204"]

    - name: Upload confirmation
      debug:
        msg: "Nexus upload successful for {{ artifact_name }}"
      when:
        - upload_rslt.stdout in ["200", "201", "204"]
